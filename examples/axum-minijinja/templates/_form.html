{% from "macros/form_errors.html" import input_group, base_errors %}
<form hx-post="/" hx-target="#form-area" hx-swap="innerHTML">
  {{ base_errors(errors=errors) }}
  {{ input_group(errors=errors, field='number', label='Number', value=number, type='number') }}
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
