[package]
name = "htmx-form-errors"
version = "0.1.0"
edition = "2021"
description = "Field-level form validation errors for HTMX + template rendering"

[dependencies]
validator = { version = "0.20", optional = true }
sqlx = { version = "0.8", optional = true, default-features = false }
serde = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["validator", "serde"]
serde = ["dep:serde"]
